name: 功能建议 / Feature request
description: 描述教学场景和希望改善的体验 / Suggest an improvement
title: "[Feature] "
body:
  - type: textarea
    id: context
    attributes:
      label: 使用场景与问题 / Use case and problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与影响 / Alternatives and impact
      description: 说明对学生、教师、管理员和隐私的影响，不提供真实学生资料。
